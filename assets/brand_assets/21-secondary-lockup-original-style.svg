<svg xmlns="http://www.w3.org/2000/svg" width="700" height="850" viewBox="0 0 700 850" role="img" aria-labelledby="title desc">
  <title id="title">Intimacy Economics secondary editorial lockup</title>
  <desc id="desc">Editorial logo mark above a centered two-line all-caps wordmark.</desc>
  <g transform="translate(140 50) scale(.7)">
    <defs><clipPath id="leftClip"><circle cx="250" cy="230" r="150"/></clipPath></defs>
    <circle cx="350" cy="230" r="150" fill="#E7D6D2" fill-opacity=".48" clip-path="url(#leftClip)"/>
    <circle cx="250" cy="230" r="150" fill="none" stroke="#0F0F0F" stroke-width="7"/>
    <circle cx="350" cy="230" r="150" fill="none" stroke="#E6392D" stroke-width="7"/>
    <line x1="300" y1="178" x2="300" y2="282" stroke="#0F0F0F" stroke-width="7"/>
    <circle cx="300" cy="178" r="15" fill="#0F0F0F"/><circle cx="300" cy="282" r="15" fill="#E6392D" stroke="#0F0F0F" stroke-width="2"/>
  </g>
  <text x="350" y="520" text-anchor="middle" fill="#0F0F0F" font-family="Didot, 'Bodoni MT', 'Times New Roman', serif" font-size="92" letter-spacing="2">INTIMACY</text>
  <text x="350" y="620" text-anchor="middle" fill="#0F0F0F" font-family="Didot, 'Bodoni MT', 'Times New Roman', serif" font-size="92" letter-spacing="2">ECONOMICS</text>
  <line x1="320" y1="670" x2="380" y2="670" stroke="#E6392D" stroke-width="4"/>
  <text x="350" y="735" text-anchor="middle" fill="#343230" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="8">A MEDIA BRAND</text>
</svg>
