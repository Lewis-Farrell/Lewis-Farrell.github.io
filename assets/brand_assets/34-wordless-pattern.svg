<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Intimacy Economics wordless pattern</title>
  <desc id="desc">Transparent repeat pattern made from the overlapping-circle mark.</desc>
  <defs>
    <clipPath id="lens"><circle cx="82" cy="70" r="42"/></clipPath>
    <pattern id="marks" width="220" height="180" patternUnits="userSpaceOnUse">
      <g transform="translate(25 20)">
        <circle cx="110" cy="70" r="42" fill="#E7D6D2" fill-opacity=".22" clip-path="url(#lens)"/>
        <circle cx="82" cy="70" r="42" fill="none" stroke="#0F0F0F" stroke-opacity=".18" stroke-width="2"/>
        <circle cx="110" cy="70" r="42" fill="none" stroke="#E6392D" stroke-opacity=".3" stroke-width="2"/>
        <line x1="96" y1="55" x2="96" y2="85" stroke="#0F0F0F" stroke-opacity=".22" stroke-width="2"/>
        <circle cx="96" cy="55" r="4" fill="#0F0F0F" fill-opacity=".3"/><circle cx="96" cy="85" r="4" fill="#E6392D" fill-opacity=".5"/>
      </g>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#marks)"/>
</svg>
